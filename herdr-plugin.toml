id = "herdr-durable"
name = "Herdr Durable"
version = "2.0.0"
min_herdr_version = "0.9.5"
description = "Resume Claude Code and Codex with their original launch flags"
platforms = ["linux", "macos"]

[[build]]
command = ["node", "configure.js", "check"]

[[startup]]
command = ["node", "plugin.js", "sync"]

[[events]]
on = "pane.agent_detected"
command = ["node", "plugin.js", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "plugin.js", "event"]

[[actions]]
id = "sync"
title = "Herdr Durable: report resume commands now"
description = "Report resume commands for every running Claude Code and Codex pane"
contexts = ["global"]
command = ["node", "plugin.js", "sync"]
